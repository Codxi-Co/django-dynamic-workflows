repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]


  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest tests/ --tb=short -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]